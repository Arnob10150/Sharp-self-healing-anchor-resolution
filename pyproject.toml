[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-anchor-resolution"
version = "0.1.0"
description = "Content-fingerprint anchoring for self-healing folder reference resolution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[project.scripts]
sharp = "sharp.cli:main"

[tool.setuptools]
packages = ["sharp"]
